<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dot Pet Dock</title>
  <link rel="stylesheet" href="popup.css">
  <script src="popup.js" defer></script>
</head>
<body>
  <header>
    <div class="logo" aria-hidden="true">✦</div>
    <div>
      <h1>Dot Pet Dock</h1>
      <p class="subtitle">Give your pet some room.</p>
    </div>
  </header>

  <div id="status" role="status">Checking this tab…</div>
  <div class="actions" aria-label="Find your pet">
    <button type="button" id="find" class="primary" disabled>Find pet automatically</button>
    <button type="button" id="pick" class="secondary" disabled>Pick pet on page</button>
  </div>

  <section aria-label="Pet adjustments">
    <div class="line">
      <label for="scale">Display size</label>
      <output id="scale-output" for="scale">100%</output>
    </div>
    <input id="scale" type="range" min="50" max="500" step="1" value="100" disabled aria-valuemin="50" aria-valuemax="500" aria-valuenow="100">
    <div class="range-labels" aria-hidden="true"><span>50%</span><span>500%</span></div>
    <label class="check"><input type="checkbox" id="lock" disabled> Lock in place / hide handles</label>
  </section>

  <button type="button" id="reset" class="secondary" disabled>Restore original display</button>
  <p class="help">After selecting, drag the <strong>Move</strong> handle or pull the purple corner to resize. Size, position, and lock state are saved for this pet across conversations.</p>
  <p class="shortcut">Shortcut: Alt + Shift + P to pick again · Esc to cancel.</p>
</body>
</html>
