<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dot Pet Dock</title>
  <link rel="stylesheet" href="popup.css">
  <script src="popup.js" defer></script>
</head>
<body>
  <header>
    <div class="logo" aria-hidden="true">✦</div>
    <div>
      <h1>Dot Pet Dock</h1>
      <p class="subtitle">Give that pet some room.</p>
    </div>
  </header>

  <div id="status" role="status">Checking this tab…</div>
  <button type="button" id="pick" class="primary">Pick pet on page</button>

  <section aria-label="Pet adjustments">
    <div class="line">
      <label for="scale">Display size</label>
      <output id="scale-output" for="scale">100%</output>
    </div>
    <input id="scale" type="range" min="50" max="500" step="10" value="100" disabled>
    <label class="check"><input type="checkbox" id="lock" disabled> Lock in place / hide handles</label>
  </section>

  <button type="button" id="reset" class="secondary" disabled>Restore original display</button>
  <p class="help">After picking, drag the <strong>Move</strong> handle or pull the purple corner to resize. Changes are saved for this page.</p>
  <p class="shortcut">Shortcut: Alt + Shift + P to pick again · Esc to cancel.</p>
</body>
</html>
